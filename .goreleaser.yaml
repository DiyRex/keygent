# GoReleaser v2 config. Run only through .github/workflows/release.yml (manual dispatch), or locally:
#   goreleaser release --snapshot --clean --skip=sign     # needs zig + cargo-zigbuild (see CONTRIBUTING)
# Asset names and layout must match install.sh / install.ps1: keygent-<tag>-<target>.<ext> containing
# keygent-<tag>-<target>/keygent, plus SHA256SUMS and its Sigstore bundle SHA256SUMS.sigstore.json.
version: 2
project_name: keygent

builds:
  - id: keygent
    builder: rust
    binary: keygent
    flags: [--release, --locked]
    # Static musl on Linux, cross-built with zig. Windows is added once src/platform builds there (ROADMAP).
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
    env:
      - RUSTFLAGS=--remap-path-prefix={{ .Env.PWD }}=.
    hooks:
      # Every target: SPEC §4 size budget, and no test-profile override string (SPEC §11).
      post: sh scripts/release-check.sh "{{ .Path }}"

archives:
  - id: keygent
    name_template: "keygent-{{ .Tag }}-{{ .Target }}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, NOTICE]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  # CycloneDX SBOM from Cargo.lock (cargo-cyclonedx), generated by the workflow before GoReleaser runs.
  extra_files:
    - glob: sbom/keygent.cdx.json

# Keyless Sigstore signature over SHA256SUMS; install.sh pins the identity to release.yml on a v* tag.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

changelog:
  use: github-native

release:
  github:
    owner: DiyRex
    name: keygent
  prerelease: auto
  mode: keep-existing
  extra_files:
    - glob: sbom/keygent.cdx.json

# The Homebrew formula is rendered by scripts/brew-formula.sh from the signed SHA256SUMS (GoReleaser's `brews` is
# deprecated, and casks are quarantined on macOS), then pushed to DiyRex/homebrew-tap by the release workflow.

# cargo-deny config. `cargo deny check` covers advisories (RustSec, same DB as cargo audit), licenses, bans, sources.

[advisories]
yanked = "deny"

[licenses]
# CDLA-Permissive-2.0: the Mozilla root list in webpki-roots (data licence; text referenced in NOTICE)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "tokio", reason = "no async runtime" },
  { name = "openssl-sys", reason = "RustCrypto only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

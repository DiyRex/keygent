# cargo-deny config. `cargo deny check` covers advisories (RustSec, same DB as cargo audit), licenses, bans, sources.

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
private = { ignore = true }   # our own unpublished crate has no license yet

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "tokio", reason = "no async runtime" },
  { name = "openssl-sys", reason = "RustCrypto only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

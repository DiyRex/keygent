name: security

# Weekly RustSec advisory check of Cargo.lock (cargo-deny). Opens one issue when an advisory affects a dependency.
# Runs only on schedule or by hand; never on push or pull request.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity — re-enable from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # only to open the alert issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deny
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
      - name: open an issue for new advisories
        if: steps.deny.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Security advisory affects keygent dependencies"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length')"
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "\`cargo deny check advisories\` failed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Review the log, then update or replace the affected crates."
          fi
          exit 1

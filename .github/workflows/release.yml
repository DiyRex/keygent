name: release

# Manual only (Actions → release → Run workflow). Nothing runs on push, pull request or tag push, to save CI minutes.
#   mode=snapshot  any branch: checks + GoReleaser snapshot; binaries are uploaded to the run as artifacts (14 days), nothing is published.
#   mode=release   only from a vX.Y.Z tag whose commit is on main ("Use workflow from" → the tag): checks, build, sign,
#                  attest, publish the GitHub release, then update the Homebrew formula in DiyRex/homebrew-tap.
# install.sh pins the signing identity to this file name and a v* tag ref, so keep the name `release.yml`.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot (any branch, no publish) or release (v* tag on main)"
        type: choice
        options: [snapshot, release]
        default: snapshot

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: release only from a semver tag on main
        if: inputs.mode == 'release'
        shell: bash
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::release mode must run from a vX.Y.Z tag (got $GITHUB_REF)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit is not on main"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "${GITHUB_REF_NAME%%-*}" ] || [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"; exit 1; }

  # Windows joins this matrix once src/platform builds there (ROADMAP: Windows platform layer).
  check:
    needs: guard
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --features test-profile

  deny:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  # One macOS runner builds every target: darwin natively, Linux musl through zig (keygent links no Apple framework).
  goreleaser:
    needs: [check, deny]
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write       # create the release (release mode only)
      id-token: write       # keyless cosign + provenance via GitHub OIDC
      attestations: write   # build-provenance attestation
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # GoReleaser reads tags for the version and changelog
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: install cargo-zigbuild and cargo-cyclonedx
        run: cargo install --locked cargo-zigbuild@0.24.1 cargo-cyclonedx
      - name: SBOM (CycloneDX from Cargo.lock)
        run: |
          cargo cyclonedx --format json --override-filename keygent.cdx
          mkdir -p sbom && mv keygent.cdx.json sbom/
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.mode == 'release'
        with:
          cosign-release: v3.1.4   # same version the install scripts pin for verification
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ inputs.mode == 'release' && 'release --clean' || 'release --snapshot --clean --skip=sign' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.mode == 'release'
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keygent-${{ inputs.mode }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS*
            sbom/keygent.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Prereleases (-rc…) never update the tap. Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained PAT with
  # contents: write on DiyRex/homebrew-tap only.
  homebrew:
    needs: goreleaser
    if: inputs.mode == 'release' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keygent-release-${{ github.sha }}
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: verify the signed checksums before using them
        run: |
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: render formula
        run: sh scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > keygent.rb
      - name: push to DiyRex/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "::error::HOMEBREW_TAP_TOKEN is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/DiyRex/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp keygent.rb tap/Formula/keygent.rb
          cd tap
          git config user.name "keygent-release"
          git config user.email "noreply@github.com"
          git add Formula/keygent.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "🔖 keygent ${GITHUB_REF_NAME}"
          git push origin HEAD:main

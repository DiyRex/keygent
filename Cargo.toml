[package]
name = "keygent"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Sealed secrets broker for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/DiyRex/keygent"
publish = false

[features]
# Test isolation only: lets KEYGENT_TEST_ROOT redirect every location. Never enabled in release builds.
test-profile = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# TLS client for the custody proxy (ADR 0022): ring provider, TLS 1.2+1.3, bundled Mozilla roots
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = false

# Argon2id at 64 MiB is unusably slow unoptimized; optimize dependencies in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"

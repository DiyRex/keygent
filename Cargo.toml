[package]
name = "keygent"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Sealed secrets broker for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/DiyRex/keygent"
publish = false

[dependencies]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stderr = "warn"
